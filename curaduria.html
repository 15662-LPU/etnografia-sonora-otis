<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Curaduria | Punto Cero</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0d1117;
      --panel: #161b22;
      --panel-2: #0f1720;
      --line: #30363d;
      --text: #e6edf3;
      --muted: #8b949e;
      --blue: #58a6ff;
      --green: #3fb950;
      --red: #ff7b72;
      --yellow: #d29922;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 15px;
      line-height: 1.5;
    }

    header {
      border-bottom: 1px solid var(--line);
      background: rgba(13, 17, 23, .94);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .bar {
      width: min(1120px, calc(100% - 32px));
      margin: 0 auto;
      min-height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    h1 {
      margin: 0;
      font-size: 1.05rem;
      font-weight: 750;
      letter-spacing: 0;
    }

    main {
      width: min(1120px, calc(100% - 32px));
      margin: 24px auto 48px;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 18px;
    }

    .login-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 14px;
      align-items: end;
    }

    label {
      display: block;
      color: var(--muted);
      font-size: .78rem;
      font-weight: 700;
      margin-bottom: 6px;
    }

    input, textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #0d1117;
      color: var(--text);
      padding: 10px 11px;
      font: inherit;
    }

    textarea {
      min-height: 84px;
      resize: vertical;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      margin-top: 12px;
    }

    button, .link-button {
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #21262d;
      color: var(--text);
      padding: 9px 12px;
      font: inherit;
      font-weight: 750;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-height: 38px;
    }

    button:hover, .link-button:hover { border-color: #8b949e; }
    button:disabled { cursor: wait; opacity: .62; }

    .primary { background: #1f6feb; border-color: #388bfd; }
    .approve { background: #238636; border-color: #2ea043; }
    .reject { background: #da3633; border-color: #f85149; }
    .quiet { color: var(--muted); background: transparent; }

    .toolbar {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: center;
      margin: 22px 0 14px;
    }

    .session {
      color: var(--muted);
      font-size: .82rem;
      word-break: break-word;
    }

    .status {
      margin-top: 12px;
      color: var(--muted);
      font-size: .86rem;
    }

    .status.ok { color: var(--green); }
    .status.err { color: var(--red); }

    .login-note {
      margin-top: 10px;
      color: var(--muted);
      font-size: .82rem;
    }

    .cards {
      display: grid;
      gap: 12px;
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 16px;
    }

    .card-head {
      display: flex;
      justify-content: space-between;
      gap: 14px;
      align-items: flex-start;
      margin-bottom: 10px;
    }

    .title {
      font-weight: 800;
      font-size: 1rem;
      margin-bottom: 3px;
    }

    .meta, .small {
      color: var(--muted);
      font-size: .82rem;
    }

    .badge {
      border: 1px solid rgba(210, 153, 34, .45);
      color: var(--yellow);
      background: rgba(210, 153, 34, .12);
      border-radius: 999px;
      padding: 3px 9px;
      font-size: .72rem;
      font-weight: 800;
      white-space: nowrap;
      text-transform: uppercase;
    }

    .detail-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px 16px;
      margin: 12px 0;
    }

    .detail {
      background: var(--panel-2);
      border: 1px solid rgba(48, 54, 61, .75);
      border-radius: 6px;
      padding: 9px;
      min-width: 0;
    }

    .detail strong {
      display: block;
      color: var(--muted);
      font-size: .72rem;
      margin-bottom: 2px;
    }

    .description {
      margin: 12px 0;
      color: #c9d1d9;
      white-space: pre-wrap;
    }

    audio {
      width: 100%;
      margin: 8px 0 4px;
      accent-color: #1f6feb;
    }

    .empty {
      border: 1px dashed var(--line);
      border-radius: 8px;
      padding: 28px 18px;
      text-align: center;
      color: var(--muted);
    }

    @media (max-width: 760px) {
      .bar, main { width: min(100% - 20px, 1120px); }
      .login-grid, .detail-grid { grid-template-columns: 1fr; }
      .toolbar, .card-head { flex-direction: column; align-items: stretch; }
      .actions button, .actions .link-button { width: 100%; }
    }
  </style>
</head>
<body>
  <header>
    <div class="bar">
      <h1>Curaduria de testimonios</h1>
      <a class="link-button quiet" href="index.html">Volver al mapa</a>
    </div>
  </header>

  <main>
    <section id="login-panel" class="panel">
      <form id="login-form">
        <div class="login-grid">
          <div>
            <label for="email">Correo administrador</label>
            <input id="email" name="email" type="email" autocomplete="username" value="gvalenzuela@somoseduk.org" required />
          </div>
          <div>
            <label for="password">Contrasena</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required />
          </div>
        </div>
        <div class="login-note">Acceso con la contrasena configurada manualmente en Supabase Auth.</div>
        <div class="actions">
          <button class="primary" type="submit" id="login-submit">Entrar con contrasena</button>
        </div>
        <div id="login-status" class="status"></div>
      </form>
    </section>

    <section id="admin-panel" hidden>
      <div class="toolbar">
        <div>
          <div class="session" id="session-label"></div>
          <div class="small">Mostrando testimonios con estado pending.</div>
        </div>
        <div class="actions" style="margin-top:0">
          <button type="button" id="refresh">Actualizar</button>
          <button type="button" class="quiet" id="logout">Salir</button>
        </div>
      </div>
      <div id="work-status" class="status"></div>
      <div id="cards" class="cards"></div>
    </section>
  </main>

  <script>
    var SUPABASE_URL = 'https://zopzhhqzuslyafznwhnc.supabase.co';
    var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpvcHpoaHF6dXNseWFmem53aG5jIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEwMzA2NTQsImV4cCI6MjA5NjYwNjY1NH0.KW9A72h4QI7sdkiUqz_jYqElmD_npt5PGctLczHM2D0';
    var SUPABASE_BUCKET = 'testimonios-audio';
    var ADMIN_EMAIL = 'gvalenzuela@somoseduk.org';
    var SESSION_KEY = 'punto_cero_curaduria_session';

    var loginPanel = document.getElementById('login-panel');
    var adminPanel = document.getElementById('admin-panel');
    var loginForm = document.getElementById('login-form');
    var loginSubmit = document.getElementById('login-submit');
    var loginStatus = document.getElementById('login-status');
    var workStatus = document.getElementById('work-status');
    var cards = document.getElementById('cards');
    var sessionLabel = document.getElementById('session-label');
    var currentSession = null;

    function setStatus(el, message, type) {
      el.textContent = message || '';
      el.className = 'status' + (type ? ' ' + type : '');
    }

    function escapeHtml(value) {
      return String(value == null ? '' : value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function headers(session, extra) {
      var token = session && session.access_token ? session.access_token : SUPABASE_ANON_KEY;
      var base = {
        apikey: SUPABASE_ANON_KEY,
        Authorization: 'Bearer ' + token
      };
      Object.keys(extra || {}).forEach(function(key) { base[key] = extra[key]; });
      return base;
    }

    async function api(path, options, session) {
      return fetch(SUPABASE_URL + path, Object.assign({
        headers: headers(session)
      }, options || {}));
    }

    function saveSession(session) {
      currentSession = session;
      localStorage.setItem(SESSION_KEY, JSON.stringify(session));
    }

    function clearSession() {
      currentSession = null;
      localStorage.removeItem(SESSION_KEY);
    }

    function storedSession() {
      try {
        return JSON.parse(localStorage.getItem(SESSION_KEY) || 'null');
      } catch (error) {
        return null;
      }
    }

    async function getUser(session) {
      var response = await api('/auth/v1/user', {}, session);
      if (!response.ok) throw new Error('No se pudo validar la sesion');
      return response.json();
    }

    async function ensureAdmin(session) {
      var user = await getUser(session);
      if (!user || String(user.email || '').toLowerCase() !== ADMIN_EMAIL) {
        throw new Error('Esta pagina solo acepta la cuenta administradora autorizada.');
      }
      session.user = user;
      saveSession(session);
      return session;
    }

    function showAdmin(session) {
      loginPanel.hidden = true;
      adminPanel.hidden = false;
      sessionLabel.textContent = 'Sesion activa: ' + (session.user && session.user.email ? session.user.email : ADMIN_EMAIL);
    }

    function showLogin() {
      loginPanel.hidden = false;
      adminPanel.hidden = true;
    }

    function decodeJwtPayload(token) {
      if (!token || token.split('.').length < 2) return {};
      try {
        var payload = token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
        var padded = payload + '='.repeat((4 - payload.length % 4) % 4);
        return JSON.parse(atob(padded));
      } catch (error) {
        return {};
      }
    }

    async function checkAdminPolicy() {
      var payload = decodeJwtPayload(currentSession && currentSession.access_token);
      var response = await api('/rest/v1/rpc/is_testimony_admin', {
        method: 'POST',
        headers: headers(currentSession, { 'Content-Type': 'application/json' }),
        body: '{}'
      }, currentSession);
      var isAdmin = await response.json().catch(function() { return null; });
      if (!response.ok || isAdmin !== true) {
        var jwtEmail = payload.email || 'sin email en JWT';
        throw new Error('La sesion autentica, pero RLS no reconoce este usuario como admin. JWT email: ' + jwtEmail + '. Ejecuta el SQL incremental que actualiza is_testimony_admin() a ' + ADMIN_EMAIL + '.');
      }
      return payload;
    }

    function authErrorMessage(data, fallback) {
      var raw = data && (data.error_description || data.msg || data.message || data.error);
      var text = raw ? String(raw) : fallback;
      var lower = text.toLowerCase();
      if (lower.indexOf('invalid login credentials') !== -1) {
        return 'No se pudo iniciar sesion. Revisa que el correo y la contrasena coincidan con el usuario creado en Supabase Auth.';
      }
      if (lower.indexOf('email not confirmed') !== -1) {
        return 'El correo administrador aun no esta confirmado en Supabase Auth.';
      }
      if (lower.indexOf('rate limit') !== -1 || lower.indexOf('too many') !== -1) {
        return 'Supabase limito temporalmente los intentos. Espera unos minutos e intenta de nuevo con contrasena.';
      }
      return text || fallback;
    }

    async function loginWithPassword(email, password) {
      var response = await api('/auth/v1/token?grant_type=password', {
        method: 'POST',
        headers: headers(null, { 'Content-Type': 'application/json' }),
        body: JSON.stringify({ email: email, password: password })
      });
      var data = await response.json().catch(function() { return {}; });
      if (!response.ok) throw new Error(authErrorMessage(data, 'No se pudo iniciar sesion con contrasena'));
      return ensureAdmin(data);
    }

    async function hydrateFromHash() {
      if (!window.location.hash || window.location.hash.indexOf('access_token=') === -1) return false;
      var params = new URLSearchParams(window.location.hash.slice(1));
      var session = {
        access_token: params.get('access_token'),
        refresh_token: params.get('refresh_token'),
        token_type: params.get('token_type') || 'bearer',
        expires_in: Number(params.get('expires_in') || 0)
      };
      await ensureAdmin(session);
      history.replaceState(null, document.title, window.location.pathname + window.location.search);
      return true;
    }

    function encodedStoragePath(path) {
      return encodeURIComponent(path).replace(/%2F/g, '/');
    }

    async function signedAudioUrl(audioPath) {
      if (!audioPath) return null;
      var response = await api('/storage/v1/object/sign/' + SUPABASE_BUCKET + '/' + encodedStoragePath(audioPath), {
        method: 'POST',
        headers: headers(currentSession, { 'Content-Type': 'application/json' }),
        body: JSON.stringify({ expiresIn: 3600 })
      }, currentSession);
      var data = await response.json().catch(function() { return {}; });
      if (!response.ok) throw new Error(data.message || data.error || 'No se pudo firmar el audio');
      if (!data.signedURL) return null;
      return data.signedURL.indexOf('http') === 0 ? data.signedURL : SUPABASE_URL + data.signedURL;
    }

    async function fetchPendingRows() {
      var path = '/rest/v1/submissions?status=eq.pending&select=*&order=created_at.desc';
      var response = await api(path, {}, currentSession);
      if (!response.ok) {
        response = await api('/rest/v1/submissions?status=eq.pending&select=*', {}, currentSession);
      }
      var data = await response.json().catch(function() { return []; });
      if (!response.ok) throw new Error(data.message || 'No se pudieron cargar testimonios pendientes');
      return Array.isArray(data) ? data : [];
    }

    function field(label, value) {
      return '<div class="detail"><strong>' + escapeHtml(label) + '</strong><span>' + escapeHtml(value || 'No registrado') + '</span></div>';
    }

    function coordinates(row) {
      if (row.latitude == null || row.longitude == null) return 'No registradas';
      return row.latitude + ', ' + row.longitude + ' (' + (row.coordinate_type || 'sin tipo') + ')';
    }

    function renderRows(rows) {
      cards.innerHTML = '';
      if (!rows.length) {
        cards.innerHTML = '<div class="empty">No hay testimonios pendientes por revisar.</div>';
        return;
      }
      rows.forEach(function(row) {
        var card = document.createElement('article');
        card.className = 'card';
        card.innerHTML =
          '<div class="card-head">' +
            '<div>' +
              '<div class="title">' + escapeHtml(row.public_name_or_alias || 'Testimonio sin seudonimo') + '</div>' +
              '<div class="meta">' + escapeHtml([row.community, row.locality, row.municipality].filter(Boolean).join(', ') || row.place_label || 'Lugar no registrado') + '</div>' +
            '</div>' +
            '<span class="badge">' + escapeHtml(row.status || 'pending') + '</span>' +
          '</div>' +
          '<div class="detail-grid">' +
            field('Comunidad / colonia', row.community) +
            field('Municipio / localidad', [row.municipality, row.locality].filter(Boolean).join(' / ')) +
            field('Fecha', row.interview_date) +
            field('Tipo', row.testimony_type) +
            field('Coordenadas', coordinates(row)) +
            field('Archivo', row.audio_original_filename || row.audio_path) +
          '</div>' +
          '<div class="description">' + escapeHtml(row.description || 'Sin descripcion registrada.') + '</div>' +
          (row._signed_url
            ? '<audio controls preload="metadata" src="' + escapeHtml(row._signed_url) + '"></audio>'
            : '<div class="small">Audio no disponible para reproduccion.</div>') +
          '<label for="notes-' + escapeHtml(row.id) + '">Notas de curaduria</label>' +
          '<textarea id="notes-' + escapeHtml(row.id) + '" data-notes-for="' + escapeHtml(row.id) + '" placeholder="Observaciones internas">' + escapeHtml(row.admin_notes || row.curatorial_notes || '') + '</textarea>' +
          '<div class="actions">' +
            '<button class="approve" type="button" data-action="approved" data-id="' + escapeHtml(row.id) + '">Aprobar</button>' +
            '<button class="reject" type="button" data-action="rejected" data-id="' + escapeHtml(row.id) + '">Rechazar</button>' +
            '<button type="button" data-action="pending" data-id="' + escapeHtml(row.id) + '">Mantener pendiente</button>' +
          '</div>';
        cards.appendChild(card);
      });
    }

    async function loadPending() {
      setStatus(workStatus, 'Cargando testimonios pendientes...', '');
      var jwtPayload = await checkAdminPolicy();
      var rows = await fetchPendingRows();
      for (var i = 0; i < rows.length; i++) {
        try {
          rows[i]._signed_url = await signedAudioUrl(rows[i].audio_path);
        } catch (error) {
          rows[i]._signed_url = null;
        }
      }
      renderRows(rows);
      var jwtEmail = jwtPayload.email ? ' JWT email: ' + jwtPayload.email + '.' : '';
      setStatus(workStatus, rows.length + ' testimonio(s) pendiente(s).' + jwtEmail, 'ok');
    }

    async function updateStatus(id, nextStatus) {
      var notesEl = Array.prototype.find.call(document.querySelectorAll('[data-notes-for]'), function(el) {
        return el.getAttribute('data-notes-for') === id;
      });
      var notes = notesEl ? notesEl.value.trim() : '';
      var now = new Date().toISOString();
      var reviewStatusByAction = {
        pending: 'pending',
        approved: 'approved',
        rejected: 'rejected'
      };
      var curatorialReviewStatus = reviewStatusByAction[nextStatus];
      var payload = {
        status: nextStatus,
        reviewed_by: ADMIN_EMAIL,
        reviewed_at: now,
        curator: ADMIN_EMAIL,
        curated_at: nextStatus === 'pending' ? null : now,
        curatorial_review_status: curatorialReviewStatus,
        curatorial_notes: notes || null,
        admin_notes: notes || null
      };
      var response = await api('/rest/v1/submissions?id=eq.' + encodeURIComponent(id), {
        method: 'PATCH',
        headers: headers(currentSession, {
          'Content-Type': 'application/json',
          Prefer: 'return=minimal'
        }),
        body: JSON.stringify(payload)
      }, currentSession);
      if (!response.ok) {
        var data = await response.json().catch(function() { return {}; });
        if (data.message && data.message.indexOf('submissions_curatorial_review_status_check') !== -1) {
          throw new Error('PostgreSQL rechazo curatorial_review_status="' + curatorialReviewStatus + '". Ejecuta supabase/fix_curatorial_review_status_check.sql para permitir pending, approved y rejected.');
        }
        throw new Error(data.message || 'No se pudo actualizar el testimonio');
      }
    }

    loginForm.addEventListener('submit', async function(event) {
      event.preventDefault();
      var email = document.getElementById('email').value.trim().toLowerCase();
      var password = document.getElementById('password').value;
      if (email !== ADMIN_EMAIL) {
        setStatus(loginStatus, 'Solo se permite la cuenta administradora autorizada.', 'err');
        return;
      }
      if (!password) {
        setStatus(loginStatus, 'Escribe la contrasena configurada en Supabase Auth.', 'err');
        return;
      }
      try {
        loginSubmit.disabled = true;
        setStatus(loginStatus, 'Validando acceso con email y contrasena...', '');
        var session = await loginWithPassword(email, password);
        showAdmin(session);
        await loadPending();
        setStatus(loginStatus, '', '');
      } catch (error) {
        clearSession();
        showLogin();
        setStatus(loginStatus, error.message, 'err');
      } finally {
        loginSubmit.disabled = false;
      }
    });

    document.getElementById('refresh').addEventListener('click', function() {
      loadPending().catch(function(error) { setStatus(workStatus, error.message, 'err'); });
    });

    document.getElementById('logout').addEventListener('click', async function() {
      if (currentSession) {
        await api('/auth/v1/logout', { method: 'POST' }, currentSession).catch(function() {});
      }
      clearSession();
      cards.innerHTML = '';
      showLogin();
      setStatus(loginStatus, 'Sesion cerrada.', 'ok');
    });

    cards.addEventListener('click', async function(event) {
      var button = event.target.closest('button[data-action]');
      if (!button) return;
      var id = button.getAttribute('data-id');
      var action = button.getAttribute('data-action');
      try {
        button.disabled = true;
        setStatus(workStatus, 'Actualizando testimonio...', '');
        await updateStatus(id, action);
        setStatus(workStatus, action === 'approved' ? 'Testimonio aprobado.' : action === 'rejected' ? 'Testimonio rechazado.' : 'Testimonio mantenido como pendiente.', 'ok');
        await loadPending();
      } catch (error) {
        setStatus(workStatus, error.message, 'err');
      } finally {
        button.disabled = false;
      }
    });

    (async function init() {
      try {
        if (await hydrateFromHash()) {
          showAdmin(currentSession);
          await loadPending();
          return;
        }
        var session = storedSession();
        if (session && session.access_token) {
          await ensureAdmin(session);
          showAdmin(currentSession);
          await loadPending();
          return;
        }
      } catch (error) {
        clearSession();
        setStatus(loginStatus, error.message, 'err');
      }
      showLogin();
    })();
  </script>
</body>
</html>
